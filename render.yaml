services:
  - type: web
    name: stock-researcher-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: CORS_ORIGINS
        fromService:
          name: stock-researcher-web
          type: web
          property: host
          # Render only exposes "host" across services (no scheme). If this
          # doesn't resolve to a usable Origin value in your dashboard,
          # just paste the frontend's https:// URL here manually instead.

  - type: web
    name: stock-researcher-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          name: stock-researcher-api
          type: web
          property: hostport
          # Same caveat: if this doesn't come through as a full https:// URL,
          # set it manually to the API service's URL after its first deploy,
          # then trigger a redeploy of this static site.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
